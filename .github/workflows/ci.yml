name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4

      - name: 配置 Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 编译检查所有 Python 文件（语法错误）
        run: python -m compileall -q main.py frame_extractor.py transcriber.py aligner.py analyzer.py reporter.py

      - name: 安装系统依赖 ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 导入检查（确认依赖与模块可正常加载）
        run: |
          python -c "import frame_extractor, transcriber, aligner, analyzer, reporter; print('所有模块导入成功')"

      - name: 运行轻量自测（aligner 对齐逻辑）
        run: python aligner.py
